name: CI/CD Pipeline

on:
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: 'npm'
      - run: npm ci
      - name: Run tests
        env:
          NODE_ENV: production
          LOG_LEVEL: info
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}

          TZ: UTC
          PORT: 3333
          HOST: localhost

          # user jwt
          USER_JWT_SECRET: ${ { secrets.USER_JWT_SECRET } }
          USER_JWT_EXPIRES_IN: 1h
          USER_JWT_REFRESH_SECRET: ${ { secrets.USER_JWT_REFRESH_SECRET } }
          USER_JWT_REFRESH_EXPIRES_IN: 7d
          USER_JWT_REFRESH_COOKIE_MAX_AGE: 604800000

          # device jwt
          DEVICE_JWT_SECRET: ${ { secrets.DEVICE_JWT_SECRET } }
          DEVICE_JWT_EXPIRES_IN: 30d
          DEVICE_JWT_REFRESH_SECRET: ${ { secrets.DEVICE_JWT_REFRESH_SECRET } }
          DEVICE_JWT_REFRESH_EXPIRES_IN: 365d
          DEVICE_JWT_REFRESH_COOKIE_MAX_AGE: 31536000000

        run: npm test
