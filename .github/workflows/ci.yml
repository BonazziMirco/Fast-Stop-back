name: CI/CD Pipeline

on:
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      LOG_LEVEL: info
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'
          cache: 'npm'
      - run: npm ci
      - name: Run migrations
        run: npm run migrate
      - name: Run tests
        run: npm test
